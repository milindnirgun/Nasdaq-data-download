name: Test workflow for debugging

# Controls when the action will run.
on:
  #schedule:
    # Run at midnight UTC (4 pm PDT) Mon thru Fri
    #- cron: "30 22 * * 1-5"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  push:
    branches: [ develop ]

# Grant write permissions
permissions:
  contents: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  test-env:
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v5
      # set the current date in environment to be used for appending to filenames in subsequent steps
      - name: current-date
        run: |
          echo "TZ='America/New_York' DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          touch  $GITHUB_WORKSPACE/test-file-${{ env.DATE }}.log

      - name: commit-new-files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git commit -m "generated"
          git push
