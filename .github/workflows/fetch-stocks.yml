name: Download Latest Stocks

# Controls when the action will run.
on:
  schedule:
    # Run at 14:00 UTC (6:00 am PDT) Mon thru Fri
    - cron: "0 14 * * 1-5"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write  # To allow git push

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v5
      # set the current date in environment to be used for appending to filenames in subsequent steps
      - name: current-date
        run: echo "DATE=$(TZ='America/New_York' date +'%Y-%m-%d')" >> $GITHUB_ENV


      - name: fetch-data
        run: $GITHUB_WORKSPACE/scripts/fetch-stocks-data.sh

      - name: commit-new-files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git commit -m "generated"
          git push
